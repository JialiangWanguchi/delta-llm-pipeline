[delta]
login_host = "login.delta.ncsa.illinois.edu"
account = "bhsz-delta-gpu"
project_root = "/projects/bhsz"
work_root = "/work/nvme/bhsz"
default_hours = 47.5

[runtime]
# These versions and source revisions are tested as one unit. Upgrade together.
python_version = "3.10"
torch_version = "2.5.1"
torchvision_version = "0.20.1"
transformers_version = "4.49.0"
flash_attn_version = "2.5.8"
cuda_wheel = "cu124"
vllm_version = "0.20.2"
vllm_package_version = "0.20.2+cu129"
vllm_wheel_url = "https://github.com/vllm-project/vllm/releases/download/v0.20.2/vllm-0.20.2%2Bcu129-cp38-abi3-manylinux_2_31_x86_64.whl"
vllm_wheel_sha256 = "2f8c2bf2ac6d3d16f930535e66822abd71065468521884eb5b910225b2abef4b"
vllm_torch_index_url = "https://download.pytorch.org/whl/cu129"
bagel_commit = "a2fa77dd8caeefc41e6607ae0ec17408d3f4ee9f"
thinkmorph_commit = "c1a48adfa212259c8ad79dfd9d05d87c27340cef"
shared_root = "/projects/bhsz/delta-llm/shared"
# Environments and package caches contain many small files and belong on NVMe.
runtime_root = "/work/nvme/bhsz/delta-llm/shared"

[exposure]
# none | tailscale | cloudflare-quick | cloudflare-named
default_mode = "none"
cloudflared_url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"

# Only used by cloudflare-named. Keep the token in DELTA_LLM_CF_TUNNEL_TOKEN.
named_public_url = ""

# Tailscale runs rootlessly in userspace mode. For tailscale exposure, set a
# reusable + ephemeral + pre-approved auth key in TAILSCALE_AUTHKEY.
tailscale_version = "1.102.4"
tailscale_url = "https://pkgs.tailscale.com/stable/tailscale_1.102.4_amd64.tgz"
